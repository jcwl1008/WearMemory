name: Alpha build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install native tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build Alpha APKs
        run: gradle :phone:assembleDebug :watch:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: WearMemory-alpha-debug
          path: |
            phone/build/outputs/apk/debug/*.apk
            watch/build/outputs/apk/debug/*.apk
